name: green-beat-navi

services:
  app:
    image: node:lts-alpine
    working_dir: /app
    # 依存関係が未導入のときだけ npm ci を実行し、2回目以降は即起動する
    command: sh -c "[ -x node_modules/.bin/next ] || npm ci; npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
